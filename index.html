    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {

                        sans: ['"Noto Sans KR"', 'sans-serif'],

        }
    </script>
    <style>
        body {

            user-select: none;
        }
        .font-batang {
            font-family: 'Gowun Batang', serif;
        }
        .notebook-card {

        }

        }
        ::-webkit-scrollbar {

        }

            background: #d6d3d1;

<body class="flex flex-col min-h-screen items-center justify-between p-4 md:p-6 overflow-x-hidden">

    <header class="w-full max-w-md flex justify-between items-center py-2 z-10">
        <div class="flex items-center space-x-2">
            <span class="text-xl">🌸</span>
            <h1 class="font-batang font-bold text-base text-stone-700 tracking-wider">오늘의 꽃</h1>
        </div>
        
        <div class="flex items-center space-x-2 bg-white/90 backdrop-blur-md px-3 py-1 rounded-full shadow-xs border border-stone-200">
            <button onclick="navigateDay(-1)" class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-stone-100 text-stone-600 transition" title="전날 (← 방향키)">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <input type="date" id="date-jump" onchange="onDateJump(this.value)" class="bg-transparent text-xs font-medium text-stone-700 focus:outline-none cursor-pointer">
            <button onclick="navigateDay(1)" class="w-6 h-6 flex items-center justify-center rounded-full hover:bg-stone-100 text-stone-600 transition" title="다음날 (→ 방향키 또는 스페이스바)">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
            <button onclick="jumpToToday()" class="text-xs bg-rose-100 text-rose-800 font-medium px-2 py-0.5 rounded-full hover:bg-rose-200 transition ml-1">오늘</button>
        </div>
    </header>

    <main class="w-full max-w-sm my-auto py-2">
        <div id="notebook" onclick="handleCardClick(event)" class="notebook-card rounded-3xl overflow-hidden cursor-pointer page-transition transform hover:scale-[1.01] transition-all duration-300">
            
            <!-- Date Badge -->
            <div class="bg-stone-50/80 px-5 py-3 border-b border-stone-100 flex justify-between items-center">

                <span class="text-[11px] text-stone-400 font-medium"><i class="fa-regular fa-hand-pointer mr-1"></i> 터치하여 다음날</span>
            </div>

            <!-- Flower Photo Section -->
            <div class="relative w-full h-72 sm:h-80 bg-stone-100 overflow-hidden group">
                <img id="flower-image" src="" alt="꽃 사진" class="w-full h-full object-cover object-center transition-transform duration-700 group-hover:scale-105" onerror="this.src='https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=800&q=80'">
            </div>

            <!-- Flower Name & Sentence Meaning Section -->
            <div class="p-6 text-center space-y-4 bg-white">
                <h2 id="flower-name" class="font-batang text-3xl font-bold text-stone-900 tracking-tight">꽃 이름</h2>
                <div class="bg-rose-50/70 text-rose-900 px-5 py-3 rounded-2xl border border-rose-100/80 font-batang text-base leading-relaxed">
                    <span id="flower-meaning" class="text-stone-700 italic">"꽃말 문장 내용이 여기에 들어갑니다."</span>
                </div>
            </div>

        </div>
    </main>

    </footer>

                {n: "금목서", m: "은은하고 그윽한 향기로 마음의 평안을 선물합니다."},
                {n: "군자란", m: "고결하고 우아한 품격으로 세상에 따스한 품위를 보여줍니다."},
                {n: "사랑초", m: "당신을 품에 포근히 안고 영원토록 사랑을 속삭입니다."}
            ];

            const combinedPool = [...baseFlowers, ...additionalNamesPool];

            for (let i = 1; i <= totalDays; i++) {
                const dateObj = getDateFromDayOfYear(i);
                const mm = String(dateObj.m).padStart(2, '0');
                const dd = String(dateObj.d).padStart(2, '0');
                const key = `${mm}-${dd}`;

                if (specificOverrides[key]) {
                    db[key] = specificOverrides[key];
                    continue;
                }

                const item = combinedPool[(i - 1) % combinedPool.length];
                // Use a matching photo from baseFlowers cyclically if extra item doesn't have an explicit image
                const photoImg = item.img || baseFlowers[(i * 3) % baseFlowers.length].img;
                
                db[key] = {
                    name: item.n,
                    meaning: item.m,
                    img: photoImg
                };
            }
            return db;
        }

        function getDateFromDayOfYear(dayNum) {
            const daysInMonths = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            let m = 1;
            let d = dayNum;
            for (let idx = 0; idx < daysInMonths.length; idx++) {
                if (d <= daysInMonths[idx]) {
                    m = idx + 1;
                    break;
                }
                d -= daysInMonths[idx];
            }
            return { m, d };
        }

        const flowerDatabase365 = buildFull365Database();

        // Current application date state (Default to October 4, 2026)
        let currentDate = new Date(2026, 9, 4);

        window.onload = function() {
            updateDisplay();

            window.addEventListener('keydown', function(e) {
                if (e.code === 'Space' || e.code === 'ArrowRight') {
                    e.preventDefault();
                    navigateDay(1);
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    navigateDay(-1);
                }
            });
        };

        function formatDateInput(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function formatKoreanDate(d) {
            const y = d.getFullYear();
            const m = d.getMonth() + 1;
            const day = d.getDate();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const w = days[d.getDay()];
            return `${y}년 ${m}월 ${day}일 (${w})`;
        }

        function getFlowerForDate(d) {
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const key = `${m}-${day}`;
            return flowerDatabase365[key] || flowerDatabase365["01-01"];
        }

        function updateDisplay() {
            const notebook = document.getElementById('notebook');
            
            notebook.style.opacity = '0.2';
            notebook.style.transform = 'translateY(4px)';

            setTimeout(() => {
                document.getElementById('date-jump').value = formatDateInput(currentDate);
                document.getElementById('display-date').innerText = formatKoreanDate(currentDate);

                const flower = getFlowerForDate(currentDate);

                document.getElementById('flower-name').innerText = flower.name;
                document.getElementById('flower-meaning').innerText = `"${flower.meaning}"`;
                document.getElementById('flower-image').src = flower.img;

                notebook.style.opacity = '1';
                notebook.style.transform = 'translateY(0)';
            }, 100);
        }

        function navigateDay(amount) {
            currentDate.setDate(currentDate.getDate() + amount);
            updateDisplay();
        }

        function jumpToToday() {
            currentDate = new Date(2026, 9, 4);
            updateDisplay();
        }

        function onDateJump(val) {
            if (!val) return;
            const parts = val.split('-');
            currentDate = new Date(parts[0], parts[1] - 1, parts[2]);
            updateDisplay();
        }

        function handleCardClick(event) {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'BUTTON' || event.target.closest('button')) {
                return;
            }
            navigateDay(1);
        }
    </script>

</body>
</html>
